name: 週次 漫画アフィリエイトBot

on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 09:00 JST (UTC 00:00)
  workflow_dispatch:      # 手動実行も可能

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "bot/requirements.txt"

      - name: 依存パッケージをインストール
        run: |
          cd bot
          pip install -r requirements.txt

      - name: Botを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          cd bot
          python main.py

      - name: 生成された記事をコミット＆プッシュ
        run: |
          git config user.name "manga-affiliate-bot"
          git config user.email "bot@github-actions"
          git add astro-blog/src/content/manga/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 週次新刊記事を自動生成 $(date '+%Y-%m-%d')"
            git push
          fi

  deploy:
    needs: run-bot
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 最新のコミットを取得
        run: git pull origin ${{ github.ref_name }}

      - name: 依存パッケージをインストール
        run: |
          cd astro-blog
          npm install

      - name: Astro ビルド
        run: |
          cd astro-blog
          npm run build

      - name: Cloudflare Pages にデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy astro-blog/dist --project-name=manga-afi-blog
